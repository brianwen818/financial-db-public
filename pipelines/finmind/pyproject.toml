[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finmind-pipeline"
version = "0.1.0"
description = "FinMind -> Parquet -> DuckDB data pipeline for Taiwan securities"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tenacity>=9.0",
    # DuckDB needs pytz to convert TIMESTAMP WITH TIME ZONE (our ingested_at)
    # into Python objects; without it a plain SELECT * raises.
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/finmind_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
