# 產業別正規化對照表。
#
# FinMind 的 TaiwanStockInfo.industry_category 是逐次爬取累積的快照，同一個產業
# 在不同時期用了不同寫法。processed 層會新增 industry_category_norm 欄位，
# 值為下表的 canonical form；表中沒有的值則原樣保留。
#
# 格式：  來源寫法: 正規化後的寫法

aliases:
  # --- 來源錯字（板 誤植為 版）---
  "創新版股票": "創新板股票"

  # --- 「類 / 業」後綴不一致 ---
  "其他電子類": "其他電子業"
  "居家生活類": "居家生活"
  "數位雲端類": "數位雲端"
  "綠能環保類": "綠能環保"
  "運動休閒類": "運動休閒"
  "農業科技業": "農業科技"
  "金融業": "金融保險"

  # --- ETF / ETN 寫法統一 ---
  "上櫃ETF": "ETF"
  "上櫃指數股票型基金(ETF)": "ETF"
  "指數投資證券(ETN)": "ETN"

# industry_category 落在此清單者是指數偽代碼，不是可交易證券。
#
# 實測（2026-08-26）：Index(30 檔) + 大盤(2 檔 TAIEX/TPEx) 剛好等於那 32 個
# date 欄為字面字串 "None" 的列，且 stock_id 全為非數字名稱。
#
# 這些偽代碼**有真實的價量歷史**，不是空殼：
#   TAIEX  6,849 列 (1999-01-05 起)、TPEx 5,321 列、TradingConsumersGoods 4,608 列
# 所以它們**照常納入抓取範圍**（本來就在 stock_info 裡），只是打上 is_index=true
# 讓查詢能區分「個股」與「類股指數」。
#
# 注意：「所有證券」不在此清單。它標記的是 36 檔代碼為數字的權證
# （708785 信驊中信9B購01 等），是證券不是指數。
index_categories:
  - "Index"
  - "大盤"
